server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # long cache for fingerprinted assets, no cache for index.html
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # no-cache for index.html — both the exact file and the "/" route that
    # serves it, so browser rebuilds never leave a stale bundle-hash behind
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — any unknown path falls back to index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
